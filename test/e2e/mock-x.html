<style>

  body.dark { background: rgb(0, 0, 0); color: rgb(231, 233, 234); }
  body.light { background: rgb(255, 255, 255); color: rgb(15, 20, 25); }
  .col { width: 600px; margin: 0 auto; border-left: 1px solid #2f3336; border-right: 1px solid #2f3336; position: relative; }
  body.light .col { border-color: #eff3f4; }
  .timeline { position: relative; }
  [data-testid="cellInnerDiv"] { position: relative; transform: translateY(0); border-bottom: 1px solid #2f3336; }
  body.light [data-testid="cellInnerDiv"] { border-color: #eff3f4; }
  article { position: relative; display: flex; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #536471; flex: none; }
  .body { flex: 1; min-width: 0; }
  [data-testid="User-Name"] { display: flex; gap: 4px; font-size: 15px; }
  [data-testid="User-Name"] .n { font-weight: 700; }
  [data-testid="User-Name"] a { color: #71767b; text-decoration: none; }
  [data-testid="tweetText"] { font-size: 15px; line-height: 20px; white-space: pre-wrap; margin-top: 2px; }
  [data-testid="tweetText"] a { color: rgb(29, 155, 240); text-decoration: none; }
  .card { margin-top: 12px; border: 1px solid #2f3336; border-radius: 16px; overflow: hidden; }
  body.light .card { border-color: #cfd9de; }
  .card .cover { height: 160px; background: linear-gradient(135deg, #1d2a3a, #0b1520); }
  .card .t { padding: 10px 12px; font-weight: 700; }
  .card .d { padding: 0 12px 12px; color: #71767b; font-size: 14px; }
  [role="group"] { display: flex; justify-content: space-between; max-width: 425px; margin-top: 12px; color: #71767b; font-size: 13px; }
  .caret { position: absolute; top: 10px; right: 14px; color: #71767b; }
  .video { margin-top: 12px; height: 220px; border-radius: 16px; background: #111; }
</style>
</head>
