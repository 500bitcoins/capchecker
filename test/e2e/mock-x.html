<!doctype html>

<style>
  :root { --bg: #000; --text: #e7e9ea; --muted: #71767b; --line: #2f3336; --card: #16181c; --hover: #080808; --chip: #202327; --blue: #1d9bf0; }
  body.light { --bg: #fff; --text: #0f1419; --muted: #536471; --line: #eff3f4; --card: #f7f9f9; --hover: #f7f7f7; --chip: #eff3f4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  svg { display: block; }
  .shell { display: flex; justify-content: center; min-height: 100vh; }
  .nav { width: 88px; display: flex; flex-direction: column; align-items: flex-end; padding: 8px 12px 0 0; gap: 4px; position: sticky; top: 0; height: 100vh; }
  .nav .ic { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; color: var(--text); }
  .nav .ic svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav .ic.on svg { stroke-width: 2.4; }
  .nav .post { margin-top: 12px; width: 50px; height: 50px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; }
  .nav .post svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .col { width: 600px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-height: 100vh; }
  .tabs { position: sticky; top: 0; z-index: 5; display: flex; height: 53px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); }
  .tabs div { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 500; position: relative; }
  .tabs div.on { color: var(--text); font-weight: 700; }
  .tabs div.on::after { content: ""; position: absolute; bottom: 0; width: 56px; height: 4px; border-radius: 2px; background: var(--blue); }
  [data-testid="cellInnerDiv"] { border-bottom: 1px solid var(--line); }
  article { position: relative; display: flex; gap: 8px; padding: 12px 16px 4px; }
  .av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
  .body { flex: 1; min-width: 0; }
  [data-testid="User-Name"] { display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; padding-right: 30px; }
  [data-testid="User-Name"] .n { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  [data-testid="User-Name"] .h, [data-testid="User-Name"] .t { color: var(--muted); }
  .badge { width: 18px; height: 18px; flex: none; }
  .more { position: absolute; top: 10px; right: 12px; width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); }
  .more svg { width: 19px; height: 19px; fill: currentColor; }
  [data-testid="tweetText"] { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  [data-testid="tweetText"] a { color: var(--blue); }
  .media { margin-top: 12px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; position: relative; }
  .article .cover { height: 180px; position: relative; }
  .article .meta { padding: 12px; }
  .article .kicker { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--text); margin-bottom: 6px; }
  .article [data-testid="twitter-article-title"] { font-weight: 800; font-size: 17px; line-height: 22px; }
  .article .desc { color: var(--muted); margin-top: 4px; }
  .video { height: 300px; }
  .video .dur { position: absolute; left: 10px; bottom: 10px; padding: 0 6px; border-radius: 4px; background: rgba(0,0,0,.7); color: #fff; font-size: 13px; font-weight: 600; }
  .video .play { position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; box-shadow: 0 0 0 4px rgba(255,255,255,.9); }
  .video .play svg { width: 28px; height: 28px; fill: #fff; margin-left: 4px; }
  .photo { height: 250px; }
  [role="group"] { display: flex; justify-content: space-between; max-width: 100%; padding: 8px 0 4px; margin-right: -8px; color: var(--muted); font-size: 13px; }
  [role="group"] span { display: inline-flex; align-items: center; gap: 4px; }
  [role="group"] svg { width: 18.75px; height: 18.75px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .side { width: 350px; padding: 6px 0 0 28px; }
  .search { height: 44px; border-radius: 22px; border: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px; color: var(--muted); }
  .search svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
  .box { margin-top: 16px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .box h2 { margin: 0; padding: 12px 16px; font-size: 20px; font-weight: 800; }
  .trend { padding: 12px 16px; }
  .trend small { display: block; color: var(--muted); font-size: 13px; }
  .trend b { display: block; font-size: 15px; }
</style>

const posts = [
